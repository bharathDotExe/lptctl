version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: laptopctl-db
    restart: always
    environment:
      POSTGRES_DB: laptopctl_prod
      POSTGRES_USER: laptopctl_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ChangeThisProductionPasswordImmediately!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laptopctl_user -d laptopctl_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laptopctl-internal

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    container_name: laptopctl-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=laptopctl_prod;Username=laptopctl_user;Password=${DB_PASSWORD:-ChangeThisProductionPasswordImmediately!}"
      Jwt__Key: "${JWT_SECRET_KEY:-minimum-32-chars-long-secure-random-key-here-abc123}"
      Jwt__Issuer: "laptopctl-backend"
      Jwt__Audience: "laptopctl-clients"
      Jwt__ExpiryMinutes: "60"
    volumes:
      - ../installer:/app/installer:ro
      - ../dashboard:/app/dashboard:ro
    networks:
      - laptopctl-internal

  nginx:
    image: nginx:alpine
    container_name: laptopctl-proxy
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../dashboard:/usr/share/nginx/html:ro
    networks:
      - laptopctl-internal

volumes:
  postgres_data:

networks:
  laptopctl-internal:
    driver: bridge
